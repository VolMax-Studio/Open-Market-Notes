name: Recurrent Measurement — OMN-004 (GB BESS Duration Baseline)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 2 * *' # At 04:00 UTC on day-of-month 2 (Elexon Insights API daily telemetry availability)

permissions:
  contents: write
  pull-requests: write

jobs:
  recurrent-measurement:
    name: Execute OMN-004 Recurrent Measurement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute In-Job CI Determinism Guard (Pre-Run Clean Checkout)
        run: |
          python -m unittest discover tests

      - name: Execute Recurrent Measurement Script & Mandate 8 Abort Check
        run: |
          python scripts/recurrence_run.py --note-id 004

      - name: Create Pull Request (Human-in-the-Loop Ratification)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "recurrent-measurement(OMN-004): 13-month rolling baseline refresh"
          branch: "recurrent-measurement/omn-004-${{ github.run_id }}"
          title: "recurrent-measurement(OMN-004): 13-month rolling baseline refresh"
          body-path: ${{ runner.temp }}/pr_body.md
          add-paths: |
            notes/004-gb-duration-baseline/results.json
            notes/004-gb-duration-baseline/data_manifest.json
            notes/004-gb-duration-baseline/history/measurement_log.json
            notes/004-gb-duration-baseline/results/*.png
          delete-branch: true
