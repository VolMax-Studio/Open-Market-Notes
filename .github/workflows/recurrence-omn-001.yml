name: Recurrent Measurement — OMN-001 (NEM Duration Baseline)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *' # At 04:00 on day-of-month 1

permissions:
  contents: write
  pull-requests: write

jobs:
  recurrent-measurement:
    name: Execute OMN-001 Recurrent Measurement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests matplotlib jinja2 nemosis pyarrow

      - name: Execute Recurrent Measurement Script & Mandate 8 Abort Check
        run: |
          python scripts/recurrence_run.py --note-id 001

      - name: Create Pull Request (Human-in-the-Loop Ratification)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "recurrent-measurement(OMN-001): 13-month rolling baseline refresh"
          branch: "recurrent-measurement/omn-001-${{ github.run_id }}"
          title: "recurrent-measurement(OMN-001): 13-month rolling baseline refresh"
          body-path: ${{ runner.temp }}/pr_body.md
          add-paths: |
            notes_registry.json
            notes/001-nem-duration-baseline/results.json
            notes/001-nem-duration-baseline/data_manifest.json
            notes/001-nem-duration-baseline/history/measurement_log.json
            notes/001-nem-duration-baseline/results/*.png
